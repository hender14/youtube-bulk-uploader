name: Deploy

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/rust.yml

  deploy:
    needs: checks
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      GCP_RUN_SERVICE: ${{ vars.GCP_RUN_SERVICE }}
      GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        working-directory: rust
        run: rustup show
      - name: Validate protected source tag
        working-directory: rust
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor HEAD origin/main
          cargo metadata --locked --no-deps --format-version 1 |
            python3 -c 'import json, os, sys; package = next(item for item in json.load(sys.stdin)["packages"] if item["name"] == "yt-uploader-rs"); assert "v" + package["version"] == os.environ["RELEASE_TAG"], "Tag must match Cargo version"'
      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
      - name: Build and publish reviewed source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REPOSITORY}/yt-uploader"
          CONTEXT="$RUNNER_TEMP/yt-uploader-runtime"
          mkdir -p "$CONTEXT"
          install -m 755 rust/target/release/yt-uploader-rs "$CONTEXT/yt-uploader-rs"
          if gcloud artifacts docker images describe "${IMAGE}:${RELEASE_TAG}" --format='value(image_summary.digest)' >/dev/null 2>&1; then
            docker pull "${IMAGE}:${RELEASE_TAG}"
            SOURCE_REVISION="$(docker image inspect --format='{{index .Config.Labels "org.opencontainers.image.revision"}}' "${IMAGE}:${RELEASE_TAG}")"
            [[ "$SOURCE_REVISION" == "$GITHUB_SHA" ]]
          else
            docker build --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --file rust/Dockerfile.release --tag "${IMAGE}:${RELEASE_TAG}" "$CONTEXT"
            docker push "${IMAGE}:${RELEASE_TAG}"
          fi
          DIGEST="$(gcloud artifacts docker images describe "${IMAGE}:${RELEASE_TAG}" --format='value(image_summary.digest)')"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "DEPLOY_IMAGE=${IMAGE}@${DIGEST}" >> "$GITHUB_ENV"
          echo "Published ${IMAGE}@${DIGEST} from ${GITHUB_SHA}"
      - name: Update existing Cloud Run service
        run: |
          set -euo pipefail
          gcloud run services update "$GCP_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --image "$DEPLOY_IMAGE" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --quiet